name: CI

# Every branch of the Gitflow tree is verified, not just `main`. Merges happen
# through pull requests (feature → develop, develop → main), and a PR's checks
# need its own branch's run to attach to — a trigger limited to `main` would
# leave `develop` and the feature branches unchecked until the code was
# already in production.
on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]

# One run per branch: pushing again supersedes the previous run instead of
# queueing behind it. `main` is exempt — its history is the release record.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The CI runner is the source of truth: if it fails here, it is broken.
env:
  ASTRO_TELEMETRY_DISABLED: '1'

# Read the code, and nothing else. Without this block the token every step
# receives gets the repository's default, which can include writing to it.
# Nothing here needs more: artifacts do not go through the token, and Lighthouse
# publishes its report to temporary public storage, not to the repository.
#
# Every action below is pinned to a commit rather than a tag, because a tag can
# be moved to different code after it has been reviewed. The comment names the
# version the commit is; Dependabot (`.github/dependabot.yml`) proposes the
# updates and keeps both in step.
permissions:
  contents: read

jobs:
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Only what ships: `--omit=dev` leaves out the test and lint tooling, and
      # `high` is the level at which an advisory stops being a note and becomes
      # a reason not to deploy. A new advisory fails every branch until it is
      # dealt with, which is the point: an alert nobody is made to read is an
      # alert nobody acts on.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Coverage is enforced here rather than reported for someone to read: the
      # thresholds in vitest.config.ts fail the run when coverage drops.
      - name: Unit tests and coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          retention-days: 1

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    needs: quality
    steps:
      # Only the Lighthouse config is needed from the repo: the budgets are
      # measured against the artifact `quality` already built, so the numbers
      # describe the exact bytes that passed lint, types and tests — and the
      # pipeline builds the site once instead of twice.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Download the build from the quality job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      # Budgets are assertions, not reports: dropping below 95 in any of the
      # four categories fails the build. The target audience browses on
      # mid-range phones over mobile data, so performance is a requirement.
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
