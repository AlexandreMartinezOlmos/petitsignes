name: CI

# Every branch of the Gitflow tree is verified, not just `main`. Work is merged
# locally with `--no-ff` rather than through pull requests, so a trigger limited
# to `main` would leave `develop` and the feature branches unchecked until the
# code was already in production.
on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]

# One run per branch: pushing again supersedes the previous run instead of
# queueing behind it. `main` is exempt — its history is the release record.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The CI runner is the source of truth: if it fails here, it is broken
# (CLAUDE.md §2.3).
env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    needs: quality
    steps:
      # Only the Lighthouse config is needed from the repo: the budgets are
      # measured against the artifact `quality` already built, so the numbers
      # describe the exact bytes that passed lint, types and tests — and the
      # pipeline builds the site once instead of twice.
      - uses: actions/checkout@v5

      - name: Download the build from the quality job
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Budgets are assertions: dropping below the threshold fails the build
      # (docs/requisitos.md §4.9, §9).
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
